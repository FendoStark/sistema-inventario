<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Productos</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="contenedor">
    <header>
        <h1>Sistema de Gestión de Productos</h1>
        <p>v1.2</p>
    </header>

    <section class="formulario">
        <h2 id="titulo-formulario">Agregar producto</h2>
        <form id="producto-form">
            <input type="hidden" id="producto-id">
            <div class="campo">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" required minlength="2">
            </div>
            <div class="campo">
                <label for="precio">Precio</label>
                <input type="number" id="precio" min="0" step="1" required>
            </div>
            <div class="campo">
                <label for="categoria">Categoría</label>
                <input type="text" id="categoria" required>
            </div>
            <div class="campo">
                <label for="stock">Stock en bodega</label>
                <input type="number" id="stock" min="0" step="1" required>
            </div>
            <div class="botones-formulario">
                <button type="submit" id="btn-guardar">Guardar producto</button>
                <button type="button" id="btn-cancelar" class="secundario oculto">Cancelar edición</button>
            </div>
        </form>
        <p id="mensaje"></p>
    </section>

    <section class="tabla-seccion">
        <div class="titulo-tabla">
            <h2>Productos registrados</h2>
            <button id="btn-recargar" class="secundario">Actualizar lista</button>
        </div>
        <div class="tabla-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </div>
    </section>
</main>
<script src="/static/script.js"></script>
</body>
</html>
